# Publishes the coloring-book/ folder to GitHub Pages.
# One-time setup: repo Settings > Pages > Build and deployment > Source: "GitHub Actions".
name: Deploy coloring book to GitHub Pages

on:
  push:
    branches: [claude/project-management-site-b8sBA]
    paths: ['coloring-book/**', '.github/workflows/coloring-book-pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Run unit tests
        working-directory: coloring-book
        run: npm test
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: coloring-book
      - id: deployment
        uses: actions/deploy-pages@v4
