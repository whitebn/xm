<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Photo Library</title>
<style>
  :root {
    --bg: #faf7f8; --surface: #ffffff; --ink: #1d1a1c; --muted: #6f666a; --line: #e8e0e3;
    --accent: #a8486a; --accent-soft: #f6e4ea; --shadow: 0 1px 2px rgba(0,0,0,.06), 0 4px 14px rgba(0,0,0,.05);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #151214; --surface: #1f1b1d; --ink: #f2ecee; --muted: #a99ea3; --line: #342d30;
      --accent: #e07a9c; --accent-soft: #3a2630; --shadow: 0 1px 2px rgba(0,0,0,.5);
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
  header { position: sticky; top: 0; z-index: 5; background: color-mix(in srgb, var(--bg) 92%, transparent); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); }
  .bar { max-width: 1400px; margin: 0 auto; padding: 12px 16px; display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
  h1 { font-size: 17px; margin: 0 8px 0 0; font-weight: 650; letter-spacing: -.01em; }
  input[type=search], select { font: inherit; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; }
  input[type=search] { flex: 1 1 260px; min-width: 0; }
  input:focus-visible, select:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; }
  .chip { font: inherit; font-size: 13px; cursor: pointer; border: 1px solid var(--line); background: var(--surface); color: var(--muted); border-radius: 999px; padding: 5px 12px; }
  .chip[aria-pressed=true] { background: var(--accent-soft); color: var(--accent); border-color: var(--accent); }
  .status { max-width: 1400px; margin: 0 auto; padding: 10px 16px 0; color: var(--muted); font-size: 13px; }
  .status:empty { display: none; }
  .hint { background: var(--accent-soft); color: var(--ink); border-radius: 10px; padding: 8px 12px; display: inline-block; }
  main { max-width: 1400px; margin: 0 auto; padding: 8px 16px 48px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 10px; }
  .tile { position: relative; aspect-ratio: 1; border: 0; padding: 0; cursor: pointer; border-radius: 12px; overflow: hidden; background: var(--line); box-shadow: var(--shadow); }
  .tile img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .tile .ph { position: absolute; inset: 0; display: grid; place-items: center; color: var(--muted); font-size: 13px; padding: 8px; text-align: center; }
  .tile .badge { position: absolute; left: 6px; bottom: 6px; max-width: calc(100% - 12px); font-size: 11px; background: rgba(0,0,0,.6); color: #fff; padding: 2px 8px; border-radius: 999px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tile .cap { position: absolute; inset: auto 0 0 0; padding: 22px 10px 8px; font-size: 12px; text-align: left; color: #fff; background: linear-gradient(transparent, rgba(0,0,0,.75)); opacity: 0; transition: opacity .15s; }
  .tile:hover .cap, .tile:focus-visible .cap { opacity: 1; }
  .tile:hover .badge, .tile:focus-visible .badge { opacity: 0; }
  #more { height: 1px; }
  .empty { text-align: center; color: var(--muted); padding: 64px 16px; }

  dialog { border: 0; padding: 0; background: transparent; width: min(1100px, 96vw); max-height: 94vh; color: var(--ink); }
  dialog::backdrop { background: rgba(10,8,9,.78); }
  .lb { display: grid; grid-template-columns: minmax(0, 1fr) 300px; background: var(--surface); border-radius: 16px; overflow: hidden; max-height: 94vh; }
  .stage { background: #0e0c0d; display: grid; place-items: center; min-height: 320px; max-height: 94vh; position: relative; }
  .stage img, .stage video { max-width: 100%; max-height: 94vh; display: block; }
  .nav { position: absolute; top: 50%; transform: translateY(-50%); background: rgba(0,0,0,.45); color: #fff; border: 0; font-size: 22px; width: 40px; height: 56px; cursor: pointer; border-radius: 10px; }
  .nav.prev { left: 8px; } .nav.next { right: 8px; }
  .side { padding: 18px; overflow: auto; }
  .side h2 { font-size: 16px; margin: 0 0 6px; padding-right: 64px; }
  .side dl { margin: 14px 0 0; font-size: 13px; }
  .side dt { color: var(--muted); margin-top: 8px; }
  .side dd { margin: 0; word-break: break-word; }
  .tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
  .tags .chip { padding: 3px 10px; }
  .x { position: absolute; top: 8px; right: 8px; z-index: 2; }
  @media (max-width: 760px) { .lb { grid-template-columns: 1fr; overflow: auto; } .stage { max-height: 60vh; } .stage img, .stage video { max-height: 60vh; } }
</style>
</head>
<body>
<header>
  <div class="bar">
    <h1>Photo Library</h1>
    <input id="q" type="search" placeholder="Search: beach, pasta, passport…" aria-label="Search photos" autocomplete="off">
    <select id="year" aria-label="Year"><option value="">All years</option></select>
    <select id="month" aria-label="Month"><option value="">Any month</option></select>
    <select id="trip" aria-label="Trip"><option value="">All trips</option></select>
    <div class="chips" id="kinds" role="group" aria-label="Type"></div>
  </div>
</header>
<div class="status" id="status" role="status"></div>
<div class="status" id="count" aria-live="polite"></div>
<main>
  <div class="grid" id="grid"></div>
  <div class="empty" id="empty" hidden>Nothing matches. Try fewer words or clear a filter.</div>
  <div id="more"></div>
</main>

<dialog id="lb" aria-label="Photo viewer">
  <div class="lb">
    <div class="stage" id="stage">
      <button class="nav prev" id="prev" aria-label="Previous">‹</button>
      <button class="nav next" id="next" aria-label="Next">›</button>
    </div>
    <aside class="side" id="side"></aside>
  </div>
  <button class="chip x" id="close" aria-label="Close">Close</button>
</dialog>

<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const MONTHS = ["January","February","March","April","May","June","July","August","September","October","November","December"];
  const state = { q: "", year: "", month: "", trip: "", kind: "", offset: 0, hasMore: false, loading: false, items: [], gen: 0 };
  let current = -1;

  const el = (tag, props = {}, ...kids) => {
    const n = Object.assign(document.createElement(tag), props);
    for (const k of kids) n.append(k);
    return n;
  };
  const get = async (url) => { const r = await fetch(url); if (!r.ok) throw new Error(r.status); return r.json(); };
  const fmtDate = (s) => s ? new Date(s).toLocaleDateString(undefined, { year: "numeric", month: "short", day: "numeric" }) : "Unknown date";

  function params(extra = {}) {
    const p = new URLSearchParams();
    for (const k of ["q", "year", "month", "trip", "kind"]) if (state[k]) p.set(k, state[k]);
    for (const [k, v] of Object.entries(extra)) p.set(k, v);
    return p;
  }

  function tile(item, i) {
    const b = el("button", { className: "tile", type: "button", title: item.caption || item.name });
    b.addEventListener("click", () => openBox(i));
    const ph = el("div", { className: "ph" }, item.kind === "video" ? "▶ " + item.name : item.name);
    b.append(ph);
    if (item.kind !== "video") {
      const img = el("img", { loading: "lazy", alt: item.caption || item.name, src: "/thumb/" + item.id });
      img.addEventListener("load", () => ph.remove());
      img.addEventListener("error", () => img.remove());
      b.append(img);
    }
    if (item.trip) b.append(el("span", { className: "badge" }, item.trip));
    if (item.caption) b.append(el("span", { className: "cap" }, item.caption));
    return b;
  }

  async function load(reset) {
    if (state.loading) return;
    state.loading = true;
    const gen = reset ? ++state.gen : state.gen;
    if (reset) { state.offset = 0; state.items = []; $("grid").replaceChildren(); }
    try {
      const data = await get("/api/search?" + params({ offset: state.offset }));
      if (gen !== state.gen) return;  // a newer search superseded this one
      const start = state.items.length;
      state.items.push(...data.results);
      $("grid").append(...data.results.map((it, k) => tile(it, start + k)));
      state.offset += data.results.length;
      state.hasMore = data.has_more;
      $("empty").hidden = state.items.length > 0;
      $("count").textContent = state.items.length + (state.hasMore ? "+" : "") + " shown";
    } catch (e) {
      $("status").textContent = "Could not load results: " + e.message;
    } finally {
      state.loading = false;
      if (state.hasMore && $("more").getBoundingClientRect().top < innerHeight + 400) load(false);
    }
  }

  const refresh = () => load(true);
  let timer;
  $("q").addEventListener("input", (e) => { clearTimeout(timer); timer = setTimeout(() => { state.q = e.target.value.trim(); refresh(); }, 250); });
  for (const k of ["year", "month", "trip"]) $(k).addEventListener("change", (e) => { state[k] = e.target.value; refresh(); });
  new IntersectionObserver((e) => { if (e[0].isIntersecting && state.hasMore) load(false); }, { rootMargin: "400px" }).observe($("more"));

  // Lightbox
  function openBox(i) {
    current = i;
    const it = state.items[i];
    const stage = $("stage");
    stage.querySelectorAll("img,video").forEach((n) => n.remove());
    const media = it.kind === "video"
      ? el("video", { controls: true, src: "/file/" + it.id })
      : el("img", { alt: it.caption || it.name, src: "/file/" + it.id });
    stage.prepend(media);
    $("prev").hidden = i === 0;
    $("next").hidden = i >= state.items.length - 1 && !state.hasMore;

    const side = $("side");
    side.replaceChildren(el("h2", {}, it.caption || it.name));
    if (it.text) side.append(el("div", { style: "color:var(--muted);font-size:13px" }, "Text in image: " + it.text));
    if (it.tags.length) {
      const wrap = el("div", { className: "tags" });
      for (const t of it.tags) {
        const c = el("button", { className: "chip", type: "button" }, t);
        c.addEventListener("click", () => { $("lb").close(); $("q").value = t; state.q = t; refresh(); });
        wrap.append(c);
      }
      side.append(wrap);
    }
    const dl = el("dl");
    const row = (k, v) => { if (v) dl.append(el("dt", {}, k), el("dd", {}, v)); };
    row("Date", fmtDate(it.taken_at) + (it.date_source === "mtime" ? " (file modified time, may be inaccurate)" : ""));
    row("Trip", it.trip);
    row("Scene", it.scene);
    row("Camera", it.camera);
    row("GPS", it.lat != null ? it.lat.toFixed(4) + ", " + it.lon.toFixed(4) : "");
    row("File", it.name);
    side.append(dl);
    if (!$("lb").open) $("lb").showModal();
  }
  async function step(d) {
    let n = current + d;
    if (n >= state.items.length && state.hasMore) { await load(false); }
    if (n >= 0 && n < state.items.length) openBox(n);
  }
  $("prev").addEventListener("click", () => step(-1));
  $("next").addEventListener("click", () => step(1));
  $("close").addEventListener("click", () => $("lb").close());
  $("lb").addEventListener("click", (e) => { if (e.target === $("lb")) $("lb").close(); });
  $("lb").addEventListener("close", () => $("stage").querySelectorAll("video").forEach((v) => v.pause()));
  addEventListener("keydown", (e) => {
    if (!$("lb").open) return;
    if (e.key === "ArrowLeft") step(-1);
    if (e.key === "ArrowRight") step(1);
  });

  // Filters
  function chips(container, options, key) {
    container.replaceChildren(...options.map(([label, value]) => {
      const b = el("button", { className: "chip", type: "button" }, label);
      b.setAttribute("aria-pressed", String(state[key] === value));
      b.addEventListener("click", () => {
        state[key] = value;
        container.querySelectorAll(".chip").forEach((c) => c.setAttribute("aria-pressed", String(c === b)));
        refresh();
      });
      return b;
    }));
  }

  (async () => {
    const f = await get("/api/facets");
    for (const y of f.years) $("year").append(el("option", { value: y.value }, `${y.value} (${y.n})`));
    MONTHS.forEach((m, i) => $("month").append(el("option", { value: i + 1 }, m)));
    for (const t of f.trips) $("trip").append(el("option", { value: t.value }, `${t.value} (${t.n})`));
    const names = { photo: "Photos", screenshot: "Screenshots", video: "Videos" };
    chips($("kinds"), [["All", ""], ...f.kinds.map((k) => [names[k.value] || k.value, k.value])], "kind");
    $("status").textContent = "";
    if (f.total && !f.tagged) {
      $("status").append(el("span", { className: "hint" }, "No AI captions yet, so search only matches trip names. Re-run `photosort sort … --ai --apply` to add tags."));
    }
    refresh();
  })().catch((e) => { $("status").textContent = "Could not start: " + e.message; });
})();
</script>
</body>
</html>
