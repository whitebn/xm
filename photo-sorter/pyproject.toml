[project]
name = "photosort"
version = "0.1.0"
description = "Sort photos into trips, years and months, and tag them for search"
requires-python = ">=3.10"
dependencies = ["pillow"]

[project.optional-dependencies]
ai = ["anthropic"]
places = ["reverse_geocoder"]
heic = ["pillow-heif"]

[project.scripts]
photosort = "photosort.cli:main"

[tool.setuptools]
packages = ["photosort"]

[tool.setuptools.package-data]
photosort = ["gallery.html"]
